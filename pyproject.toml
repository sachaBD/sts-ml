# Python environment for combat_rl, managed with uv (https://docs.astral.sh/uv/).
# Set up with `make env` (uv sync). `uv sync` makes .venv match exactly this file.
# uv.lock pins exact versions; commit it alongside changes here.

[project]
name = "combat_rl"
version = "0.0.0"
requires-python = ">=3.13"
dependencies = [
    "torch==2.14.0",  # CUDA 12.6 build, see [tool.uv.sources]
    "numpy==2.5.2",
    "pyarrow==23.0.1",
    "tomli-w==1.2.0",  # writes nn_play's PLAY.toml (agents/combat/player/play.py); tomllib only reads
    "sts-lightspeed",  # Python names of the simulator's enums, from the sibling lightspeed checkout
    # PyTorch to ONNX (agents/combat/nn/pytorch_to_onnx.py), and the ONNX Runtime + TensorRT nn_play links against.
    "onnx==1.23.1",
    "onnxscript==0.7.2",
    "onnxruntime-gpu==1.24.4",
    "tensorrt-cu12-libs==10.16.1.11",  # TensorRT for the onnxruntime TensorRT provider (agents/combat/nn GPU inference)
]

[tool.uv]
package = false                         # an environment for this repo, not an installable package
environments = ["sys_platform == 'linux'"]
# uv's own CPython builds ship Python.h (torch.compile builds kernels against it) and ignore apt upgrades.
python-preference = "only-managed"

[tool.uv.sources]
torch = { index = "pytorch-cu126" }
sts-lightspeed = { path = "../lightspeed/python", editable = true }

[[tool.uv.index]]
name = "pytorch-cu126"
url = "https://download.pytorch.org/whl/cu126"
explicit = true                         # only packages pinned to this index (torch) come from it
