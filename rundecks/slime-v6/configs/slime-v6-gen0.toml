# ./apps/value_train/run.sh rundecks/slime-v6/configs/slime-v6-gen0.toml
# slime-v6 step 3: gen0 value net on all bootstrap Slime Boss fights; its validation fights = the lineage test set.
[run]
id = "slime-v6-gen0"
input = [
  "combat_v3/2026-09-23/act1-a20",
  "combat_v3/2026-09-23/act1-a20-1",
  "combat_v3/2026-09-23/act1-a20-2",
  "combat_v3/2026-09-23/act1-a20-5",
  "combat_v3/2026-09-23/act1-a20-6",
  "combat_v3/2026-09-24/act1-a20-7",
]

[data]
encounters = ["slime_boss"]

[train]
epochs = 8
batch_size = 128
lr = 0.001
weight_decay = 0.0001
width = 64
seed = 0
validation_fraction = 0.2
label = "blend"
blend = 0.5

[export]
native_weights = true
path = "value_weights.bin"
