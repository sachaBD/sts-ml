# ./apps/value_train/run.sh rundecks/slime-v8/configs/slime-v8-gen1.toml
# Generation 1 network: the big-data network fine-tuned on its own self-play fights, each played position labelled
# with that fight's final score (terminal value). Decision rows only; no search estimates. Fresh 10% validation split
# over the self-play decks. Low learning rate, few epochs: a fine-tune, not a retrain.
[run]
id = "slime-v8-gen1"

[data]
query = """
select * from combat_v3
where id = 'slime-v8-selfplay-gen1' and row_kind = 'decision'
"""

[train]
initial_checkpoint = "value_net_v1/2026-09-25/slime-v8-big-data"
split = "fresh"
epochs = 4
batch_size = 128
lr = 0.0001
weight_decay = 0.0001
width = 64
seed = 0
validation_fraction = 0.1
label = "terminal"

[export]
native_weights = true
path = "value_weights.bin"
