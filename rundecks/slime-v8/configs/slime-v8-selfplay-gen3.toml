# ./apps/fight_resample/run.sh rundecks/slime-v8/configs/slime-v8-selfplay-gen3.toml
# Self-play generation 3 (ITERATION.md): current player = generation 1 network. Train decks act1-a20-8 run_seed % 10 in (8, 9),
# first version (first_sample 0). Dev search: value-net leaves, 20k simulations, 8 particles, no random moves.
[run]
id = "slime-v8-selfplay-gen3"
query = """
select * from combat_v3
where encounter = 'slime_boss' and source_episode_id is null
  and id = 'act1-a20-8' and run_seed % 10 in (8, 9)
"""
samples = 1
first_sample = 0
hp_sd = 10
random_potions = false
value_run = "value_net_v1/2026-09-25/slime-v8-gen1"
simulations = 20000
particles = 8
random_move = false
workers = 10
