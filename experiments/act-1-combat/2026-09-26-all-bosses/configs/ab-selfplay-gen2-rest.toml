# ./apps/fight_resample/run.sh experiments/act-1-combat/2026-09-26-all-bosses/configs/ab-selfplay-gen2-rest.toml
# Self-play for gen2, non-boss: ab-gen1 plays train bucket run_seed % 10 = 5, at most 330 fights per encounter
# (~ the bucket's boss fights per boss; random by hash(episode_id)), once each. Same search as the dev eval.
[run]
id = "ab-selfplay-gen2-rest"
query = """
select * from combat_v3
where id = 'act1-all-bosses-a20-scaled-search' and source_episode_id is null and run_seed % 10 = 5 and category <> 'boss'
  and episode_id in (
    select episode_id from (
      select episode_id, row_number() over (partition by category, encounter order by hash(episode_id)) k
      from (select distinct episode_id, category, encounter from combat_v3
            where id = 'act1-all-bosses-a20-scaled-search' and source_episode_id is null and run_seed % 10 = 5 and category <> 'boss'))
    where k <= 330)
"""
samples = 1
hp_sd = 10
random_potions = false
value_run = "value_net_v1/2026-09-27/ab-gen1"
simulations = 20000
particles = 8
random_move = false
workers = 11
