# ./apps/value_train/run.sh experiments/act-1-combat/2026-09-26-all-bosses/configs/ab-gen1.toml
# gen1: ab-gen0 fine-tuned on self-play fights ('ab-selfplay-gen1-boss', 'ab-selfplay-gen1-rest'), every played position labelled with its fight's final score
# (terminal value). Decision rows only. Low lr from ab-gen0's weights, cosine, best-validation checkpoint. v2 + aux, GPU.
[run]
id = "ab-gen1"

[data]
query = """
select * from combat_v3
where id in ('ab-selfplay-gen1-boss', 'ab-selfplay-gen1-rest') and row_kind = 'decision'
"""

[model]
kind = "deep_sets_v2"
width = 64
head_width = 128
head_blocks = 1

[train]
initial_checkpoint = "value_net_v1/2026-09-26/ab-gen0"
split = "fresh"
device = "cuda"
epochs = 10
batch_size = 1024
lr = 0.0001
weight_decay = 0.01
seed = 0
validation_fraction = 0.1
label = "terminal"
aux_won_weight = 0.01
aux_hp_weight = 0.1
lr_schedule = "cosine"
keep = "best"

[export]
native_weights = true
path = "value_weights.bin"
