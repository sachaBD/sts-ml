# ./apps/value_train/run.sh experiments/act-1-combat/2026-09-26-all-bosses/configs/ab-gen2.toml
# gen2: ab-gen1 fine-tuned on self-play fights ('ab-selfplay-gen1-boss', 'ab-selfplay-gen1-rest', 'ab-selfplay-gen2-boss', 'ab-selfplay-gen2-rest'), every played position labelled with its fight's final score
# (terminal value). Decision rows only. Low lr from ab-gen1's weights, cosine, best-validation checkpoint. v2 + aux, GPU.
[run]
id = "ab-gen2"

[data]
query = """
select * from combat_v3
where id in ('ab-selfplay-gen1-boss', 'ab-selfplay-gen1-rest', 'ab-selfplay-gen2-boss', 'ab-selfplay-gen2-rest') and row_kind = 'decision'
"""
oracle = false

[model]
kind = "deep_sets_v2"
width = 64
head_width = 128
head_blocks = 1
card_vocab = 512
monster_vocab = 128
move_vocab = 512
card_id_dim = 32
monster_id_dim = 16
move_dim = 16
pool_count_features = true
head_input_norm = true
output = "sigmoid"
aux_heads = true
zero_init_blocks = true

[train]
initial_checkpoint = "value_net_v1/2026-09-27/ab-gen1"
split = "fresh"
device = "cuda"
epochs = 10
batch_size = 1024
lr = 0.0001
weight_decay = 0.01
seed = 0
validation_fraction = 0.1
label = "terminal"
aux_won_weight = 0.01
aux_hp_weight = 0.1
lr_schedule = "cosine"
keep = "best"
threads = 1
