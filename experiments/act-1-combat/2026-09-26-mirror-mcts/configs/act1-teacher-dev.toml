# ./apps/value_play/run.sh experiments/act-1-combat/2026-09-26-mirror-mcts/configs/act1-teacher-dev.toml
# Rollout teacher replays the NON-boss dev eval subset (3,811 fights; Slime Boss dev already has
# combat_v3/2026-09-25/slime-v8-rollout-teacher-dev). slime-v8 protocol: guided-rollout leaves, 20k sims, 8 particles,
# no random move. The value run only supplies the train-fight guard; no weights are used.
[run]
id = "act1-teacher-dev"
input = "value_net_v1/2026-09-26/act1-gen0"
workers = 10
leaf = "guided_rollout"
simulations = 20000
particles = 8
random_move = false
query = """
select * from combat_v3
where id = 'act1-a20-8' and run_seed % 10 in (0, 1)
  and episode_id in (
    select episode_id from (
      select episode_id, encounter, row_number() over (partition by category, encounter order by episode_id) k
      from (select distinct episode_id, category, encounter from combat_v3
            where id = 'act1-a20-8' and run_seed % 10 in (0, 1) and source_episode_id is null))
    where encounter = 'slime_boss' or k <= 250)
  and encounter <> 'slime_boss'
"""
