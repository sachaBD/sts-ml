# easy cheap-agent S1: mcts-100-s1
[run]
id = "easy-cheap-mcts-100-s1"
input = "value_net_v1/2026-09-26/act1-gen1"  # net arms: the net; mcts arms: leakage guard only
workers = 11
leaf = "guided_rollout"
simulations = 100
particles = 8
random_move = false
oracle = false
search_salt = 1
skip_diverged = true
query = """
select * from combat_v3
where id = 'act1-all-bosses-a20-scaled-search' and source_episode_id is null and category = 'easy'
  and episode_id in (select source_episode_id from read_csv_auto('experiments/act-1-combat/2026-09-29-easy-cheap-agent/fights.csv'))
"""
