[run]
id = "champ-full-corpus-v1-cold"
worker = "build/champ-full-corpus/agents/combat/nn/nn_play"
seed_namespace = "champ-full-corpus-v1"
iterations = 0 # until stopped; finish the active update
recovery_retries = 2
min_free_gib = 10

[starts]
fights = "runs/benchmark/champ-full-corpus-v1/frozen/training.jsonl"
per_iteration = 10000
hp_jitter = 0.1
potions = true

[search]
sims = 16
particles = 8
gumbel_scale = 1.0
rollout_mix = 0.5
rollout_mix_decay = 30

[training]
steps = 500
batch = 2048
lr = 0.001
replay_window = 5
max_train_rows = 0
balanced_replay = false
prune_replay = true
device = "cuda"

[model]
kind = "entity"
dim = 192
layers = 4
heads = 6
gpu_tokens = 64
gpu_attended = 24
gpu_mixed_precision = true
export_reuse = false

[workers]
actors = 9
slots = 224
gpu_batch = 512
gpu_bank = [256, 32]
gpu_wait_us = 100
timeout_ms = 60000
shutdown_timeout_ms = 5000

[evaluation]
sims = 64
at = [0]
every = 3
wall_share = 0
rollout_mix = 0
fights = "runs/benchmark/champ-full-corpus-v1/frozen/validation.jsonl"
in_sample_fights = "runs/benchmark/champ-full-corpus-v1/frozen/legacy.jsonl" # secondary channel: legacy retention
final_fights = "runs/benchmark/champ-full-corpus-v1/frozen/final.jsonl"
cohorts = "runs/benchmark/champ-full-corpus-v1/frozen/cohorts.json"
