# elite-bench S4: mcts-1k-s0
[run]
id = "bench-mcts-1k-s0"
input = "value_net_v1/2026-09-27/elite-v3-t2"  # v3 arms: the net; others: leakage guard only
workers = 11
leaf = "guided_rollout"
simulations = 1000
particles = 8
random_move = false
oracle = false
skip_diverged = true
query = """
select * from combat_v3
where id = 'act1-all-bosses-a20-scaled-search' and source_episode_id is null and category = 'elite'
  and run_seed % 10 in (0, 1)
  and episode_id in (select source_episode_id from read_csv_auto('experiments/elite-bench/bench_fights.csv'))
"""
