# elite-bench round 2: t5 (policy priors, same settings as v3-20k) salt 2
[run]
id = "bench-r2t5-20k-s2"
input = "value_net_v1/2026-09-29/bench-r2-t5"  # v3 arms: the net; others: leakage guard only
workers = 11
leaf = "policy_net"
c_puct = 1.0
fpu_reduction = 0.05
prior_floor = 0.03
simulations = 20000
particles = 8
search_salt = 2
random_move = false
oracle = false
skip_diverged = true
query = """
select * from combat_v3
where id = 'act1-all-bosses-a20-scaled-search' and source_episode_id is null and category = 'elite'
  and run_seed % 10 in (0, 1)
  and episode_id in (select source_episode_id from read_csv_auto('experiments/elite-bench/bench_fights.csv'))
"""
