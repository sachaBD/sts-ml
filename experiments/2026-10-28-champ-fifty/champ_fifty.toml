# Authorized fifty-deck expansion. Run until stopped; original ten retained verbatim.
# Historical monitoring scores are approximate references under older simulator rules.
# Bootstrap is disabled: old teacher trajectories do not replay after correctness fixes.
# No old PV training/inference or fresh teacher collection is launched.
[run]
warm_start_run = "gumbel_nn_combat_v1/2026-10-27/gumbel-nn-champ-ten-20261027-205535"
id = "gumbel-nn-champ-fifty-20261028"
worker = "build/nn/agents/combat/nn/nn_play"
games_per_deck = 100 # 5,000 total/update across fifty decks
seed_namespace = "gumbel-nn-champ-fifty-20261028"

[loop]
balanced_replay = true
iterations = 0 # run until ./run.sh stop RUN_DIRECTORY; finish the active update cleanly
test_every = 0
validation_share = 0.20 # measured validation wall-time budget, checked at update boundaries
prune_replay = true # keep five batches of samples, discard expired samples/engine caches
steps = 100
window = 5
max_train_rows = 500000 # uniform replay subset bounds training memory on this 16 GiB host
batch = 2048
lr = 0.001
sims = 256
rollout_mix = 0.5
workers = 9
parallel = 224
scheduler = "local"
groups = 2 # ignored by local scheduler
gpu_batch = 512
gpu_tokens = 48
gpu_bank = "256,32"
gpu_wait_us = 100
timeout_ms = 60000
shutdown_timeout_ms = 5000
dim = 64
layers = 2
heads = 2
device = "cuda"

[evaluation]
source_run = "combat_v4/2026-10-09/champ-ten-rollout-v1"
directory = "monitor-teacher"
fights_per_deck = 50 # stored historical reference for original ten only
generated_per_deck = 100
at = [0] # then every test_every updates

