# ./apps/value_train/run.sh apps/value_train/slime.toml [--scratch]
# Train a Slime Boss value net on the Slime Boss fights of a combat_v3 bootstrap run.
[run]
id = "slime-value-5"

# The rows to train on (sts_combat_rl.query; columns: runs/README.md "combat_v3 columns"),
# e.g. ... and category = 'boss', ... and encounter in ('lagavulin', 'three_sentries').
[data]
query = "select * from combat_v3 where id in ('act1-a20', 'act1-a20-1', 'act1-a20-2') and encounter = 'slime_boss'"
oracle = false

[model]
kind = "deep_sets_v1"
width = 64
card_vocab = 512
monster_vocab = 128
move_vocab = 512

[train]
epochs = 7
batch_size = 128
lr = 0.001
weight_decay = 0.0001
seed = 0
validation_fraction = 0.2
label = "blend" # blend, root, or terminal
blend = 0.5
lr_schedule = "constant"
keep = "last"
threads = 1
device = "cpu"
aux_won_weight = 0.0
aux_hp_weight = 0.0
