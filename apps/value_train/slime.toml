# ./apps/value_train/run.sh apps/value_train/slime.toml [--scratch]
# Train a Slime Boss value net on the Slime Boss fights of a combat_v3 bootstrap run.
[run]
id = "slime-value-5"
input = ["combat_v3/2026-09-23/act1-a20", "combat_v3/2026-09-23/act1-a20-1", "combat_v3/2026-09-23/act1-a20-2", "combat_v3/2026-09-23/act1-a20-3"]

# Which fights to train on; leave both out to train on every fight.
# Rows must match both when both are set. Names: runs/README.md "combat_v3 columns".
[data]
encounters = ["slime_boss"]      # e.g. ["gremlin_nob"], ["lagavulin", "three_sentries"]
# categories = ["boss"]          # easy / hard / elite / boss / event

[train]
epochs = 7
batch_size = 128
lr = 0.001
weight_decay = 0.0001
width = 64
seed = 0
validation_fraction = 0.2
label = "blend" # blend, root, or terminal
blend = 0.5
# limit = 1000
# checkpoint = "value_checkpoint.pt"

[export]
native_weights = true
path = "value_weights.bin"
