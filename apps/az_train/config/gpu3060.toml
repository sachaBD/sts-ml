# ./apps/az_train/run.sh apps/az_train/config/gpu3060.toml --scratch
# First guess for an RTX 3060 (12 GB): ~460k-parameter network, 2048 games x 1 particle x 32 simulations.
# Tune games / simulations with apps/az_bench on the card before a long run. Replace the deck files with yours.
[run]
id = "az-3060"

[decks]
train = "apps/az_train/decks/example.json"
eval = "apps/az_train/decks/example.json"

[model]
d = 128
layers = 2
heads = 4
mlp_ratio = 2

[search]
simulations = 32
particles = 1
max_considered = 16
gumbel_scale = 1.0

[selfplay]
games = 2048
chunk = 32

[train]
iterations = 2000
chunks_per_iteration = 4          # 262k decisions per iteration
steps_per_iteration = 256         # x batch 1024: each decision is trained on about once
batch_size = 1024
lr = 0.0003
weight_decay = 0.0001
value_weight = 1.0
replay_capacity = 1048576         # ~1 GB of decisions (a multiple of games)
games_table = 1048576
min_replay = 65536
seed = 0

[eval]
every = 20
simulations = 32
particles = 1
repeats = 8                       # games per eval deck
chunk = 64
