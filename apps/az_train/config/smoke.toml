# ./apps/az_train/run.sh apps/az_train/config/smoke.toml --scratch
# A minute on a laptop CPU: checks the whole loop end to end, not learning.
[run]
id = "az-smoke"

[decks]
count = 64
extra_min = 0
extra_max = 8
upgrade_prob = 0.3
hp_min = 80
hp_max = 300
seed = 0

[model]
width = 32
card_dim = 16
head_width = 64
head_blocks = 1

[search]
simulations = 8
particles = 2
max_considered = 8
gumbel_scale = 1.0

[selfplay]
games = 16
chunk = 32

[train]
iterations = 3
chunks_per_iteration = 2
steps_per_iteration = 10
batch_size = 64
lr = 0.001
weight_decay = 0.0001
value_weight = 1.0
replay_capacity = 20000
min_replay = 64
seed = 0

[eval]
every = 3
simulations = 8
particles = 2
chunk = 64
hp = [80, 200]

[eval.decks]
count = 8
extra_min = 0
extra_max = 8
upgrade_prob = 0.3
hp_min = 80
hp_max = 80
seed = 1
