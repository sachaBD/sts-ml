# ./apps/az_train/run.sh apps/az_train/config/smoke.toml --scratch
# A couple of minutes on a laptop CPU (mostly compilation): checks the whole loop end to end, not learning.
[run]
id = "az-smoke"

[decks]
train = "apps/az_train/decks/example.json"
eval = "apps/az_train/decks/example.json"

[model]
d = 32
layers = 1
heads = 2
mlp_ratio = 2

[search]
simulations = 4
particles = 1
max_considered = 4
gumbel_scale = 1.0

[selfplay]
games = 8
chunk = 8

[train]
iterations = 3
chunks_per_iteration = 2
steps_per_iteration = 5
batch_size = 32
lr = 0.001
weight_decay = 0.0001
value_weight = 1.0
replay_capacity = 4096
games_table = 4096
min_replay = 32
seed = 0

[eval]
every = 3
simulations = 4
particles = 1
repeats = 1
chunk = 64
