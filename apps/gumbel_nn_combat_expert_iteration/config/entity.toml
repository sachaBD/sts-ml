# Entity model on the full Champ corpus (best finished entity run: ~70% validation). New runs need a new [run].id.
[run]
id = "champ-full-corpus-v2-value128-64s-outcome-aux-cold"
worker = "build/main/agents/combat/player/nn_play"
seed_namespace = "champ-full-corpus-v2-64s"
iterations = 0 # until stopped; finish the active update
recovery_retries = 2
min_free_gib = 10

[starts]
fights = "runs/benchmark/champ-full-corpus-v2/frozen/training.jsonl"
per_iteration = 10000
history_iterations = 10
win_rate_prior_strength = 1.0
sampling_concentration = 0.5
hp_jitter = 0.1
potions = true
excluded_potions = ["ELIXIR_POTION", "GAMBLERS_BREW"]

[search]
sims = 64
particles = 8
gumbel_scale = 1.0
rollout_mix = 0.5
rollout_mix_decay = 50

[training]
steps = 500
batch = 2048
value_batch = 128
lr = 0.001
replay_window = 10
max_train_rows = 0
balanced_replay = false
prune_replay = true
device = "cuda"

[model]
kind = "entity"
value = "outcome"
auxiliary = true
dim = 192
layers = 4
heads = 6
mixed_precision = true
cpu_lanes = 2
cpu_batch = 64

[[model.deployments]]
tokens = 64
batches = [512, 256, 32]
lanes = 2

[[model.deployments]]
tokens = 128
batches = [32]
lanes = 1

[workers]
actors = 9
slots = 224
gpu_wait_us = 100
timeout_ms = 60000
shutdown_timeout_ms = 5000

[evaluation]
baselines = "runs/benchmark/legacy-core50-extended10/baselines.json"
final_fights = "runs/benchmark/champ-full-corpus-v2/frozen/final.jsonl"
cohorts = "runs/benchmark/champ-full-corpus-v2/frozen/cohorts.json"

[[evaluation.sets]]
name = "validation"
fights = "runs/benchmark/champ-full-corpus-v2/frozen/validation.jsonl"
at = [0]
every = 3
[evaluation.sets.search]
sims = 64
gumbel_scale = 0.0
rollout_mix = 0
particles = 8

[[evaluation.sets]]
name = "legacy_core"
fights = "runs/benchmark/legacy-core50-extended10/legacy_core.jsonl"
at = [0]
every = 3
[evaluation.sets.search]
sims = 64
gumbel_scale = 0.0
rollout_mix = 0
particles = 8

[[evaluation.sets]]
name = "legacy_extended"
fights = "runs/benchmark/legacy-core50-extended10/legacy_extended.jsonl"
at = [0]
every = 3
[evaluation.sets.search]
sims = 64
gumbel_scale = 0.0
rollout_mix = 0
particles = 8
