# Example recipe, not an approved experiment budget. Counts below are PER DECK.
# Historical monitoring scores are approximate references under older simulator rules.
# Bootstrap is disabled: old teacher trajectories do not replay after correctness fixes.
# No old PV training/inference or fresh teacher collection is launched.
[run]
id = "gumbel-nn-champ-ten-v1"
worker = "build/nn/agents/combat/nn/nn_play"
games_per_deck = 500 # 5,000 total/update; replacement reserve beyond 9 x 224 active slots
seed_namespace = "gumbel-nn-champ-ten-v1"

[loop]
iterations = 0 # run until ./run.sh stop RUN_DIRECTORY; finish the active update cleanly
test_every = 3
prune_replay = true # keep five batches of samples, discard expired samples/engine caches
steps = 100
window = 5
max_train_rows = 500000 # uniform replay subset; only prefetched minibatches enter RAM
batch = 2048
lr = 0.001
sims = 256
rollout_mix = 0.5
test_search = "gumbel" # validation player: gumbel, or network_policy for the network without search
workers = 9
parallel = 224
gpu_batch = 512
gpu_tokens = 48
gpu_bank = "256,32"
gpu_wait_us = 100
timeout_ms = 60000
shutdown_timeout_ms = 5000
dim = 64
layers = 2
heads = 2
device = "cuda"

[evaluation]
source_run = "combat_v4/2026-10-09/champ-ten-rollout-v1"
directory = "monitor-teacher"
fights_per_deck = 50
at = [0] # then every test_every updates

