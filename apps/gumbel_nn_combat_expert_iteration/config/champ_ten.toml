# Example recipe, not an approved experiment budget. Counts below are PER DECK.
# Historical monitoring scores are approximate references under older simulator rules.
# Bootstrap is disabled: old teacher trajectories do not replay after correctness fixes.
# No old PV training/inference or fresh teacher collection is launched.
[run]
id = "gumbel-nn-champ-ten-v1"
worker = "build/nn/agents/combat/nn/nn_play"
seed_namespace = "gumbel-nn-champ-ten-v1"
games_per_deck = 500 # 5,000 total/update; replacement reserve beyond 9 x 224 active slots
iterations = 0 # run until ./run.sh stop RUN_DIRECTORY; finish the active update cleanly

[search] # self-play; evaluation plays the same search without noise
sims = 256
gumbel_scale = 1.0
rollout_mix = 0.5
rollout_mix_decay = 30 # rollouts bootstrap: mix falls linearly to 0 (network alone) at iteration 30
particles = 8

[training]
fights = "runs/benchmark/champ-ten/decks.jsonl" # make_fights decks config/champ_ten_decks.toml
steps = 100
batch = 2048
lr = 0.001
replay_window = 5
max_train_rows = 500000 # uniform replay subset; only prefetched minibatches enter RAM
balanced_replay = false
prune_replay = true # keep five batches of samples, discard expired samples/engine caches
device = "cuda"

[model]
kind = "transformer"
dim = 64
layers = 2
heads = 2
gpu_tokens = 48
export_reuse = false

[workers]
actors = 9
slots = 224
gpu_batch = 512
gpu_bank = [256, 32]
gpu_wait_us = 100
timeout_ms = 60000
shutdown_timeout_ms = 5000

[evaluation]
sims = 256 # 0 = the network alone
at = [0]
every = 3
wall_share = 0
# make_fights teacher <decks.jsonl> combat_v4/2026-10-09/champ-ten-rollout-v1:monitor-teacher <dir> --name mcts20k
#   --fights-per-deck 50 --baseline puct=combat_v4/2026-10-09/champ-ten-rollout-v1:update006/monitor
fights = "runs/benchmark/champ-ten/teacher/fights.jsonl"
rollout_mix = 0 # every evaluation plays the same search, so the curve follows the network, not the schedule
baselines = "runs/benchmark/champ-ten/teacher/baselines.json"
cohorts = "runs/benchmark/champ-ten/teacher/cohorts.json"

