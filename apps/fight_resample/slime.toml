# ./apps/fight_resample/run.sh apps/fight_resample/slime.toml [--scratch]
# Every stored Slime Boss fight of the source runs, replayed to its start and played `samples` more times.
[run]
id = "slime-resample-x4"
# The fights to resample (sts_combat_rl.query); they must come from bootstrap runs.
query = "select * from combat_v3 where id like 'act1-a20%' and encounter = 'slime_boss'"
samples = 4             # per source fight, at most 1000 (4 new + the stored one = 5 versions of each fight)
hp_sd = 10              # starting HP ~ Normal(stored starting HP, hp_sd), rounded into [1, max HP]
random_potions = false  # true: each held potion becomes a random potion drop
workers = 10
# fights = 20                                        # only the first N queried fights (by episode_id)
# value_run = "value_net_v1/2026-09-24/slime-v6-gen0" # teacher leaf: value net (default: guided rollout, as bootstrap)
