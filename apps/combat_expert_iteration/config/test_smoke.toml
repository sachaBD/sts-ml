# ./apps/combat_expert_iteration/evaluate.sh apps/combat_expert_iteration/config/test_smoke.toml --scratch --overwrite
# Tiny pipeline check; results mean nothing.
[run]
id = "test-smoke"
worker_run = "combat_v4/2026-10-05/human-combat-r01"   # out/frozen/pv_worker, sha256 58c5c4ab... (all agents were trained/tested with it)
workers = 10
fights = 2          # fresh seeds PER DECK; every agent plays the same starts of its decks

[[agent]]
name = "joint"           # one network for both fights: champ-both-rollout-v1, update 5
kind = "network"
model = "runs/schema=combat_v4/date=2026-10-08/id=champ-both-rollout-v1/out/update005/model"
sims = 100
rollout_mix = 0.5
decks = ["barricade", "demon-form"]

[[agent]]
name = "mcts"            # guided-rollout MCTS, the deployed baseline
kind = "mcts"
sims = 200
decks = ["barricade", "demon-form"]

[[agent]]
name = "barricade-spec"  # network-only recipe specialist, single-deck-fresh-v1 iter005 (595/600 vs MCTS 514/600)
kind = "network"
model = "runs/schema=combat_v4/date=2026-10-05/id=single-deck-fresh-v1/out/iter005/model"
sims = 100
rollout_mix = 0.0
decks = ["barricade"]

[[agent]]
name = "demon-spec"      # rollout recipe specialist, Phase5 strong update3 (485/600 vs MCTS 441/600)
kind = "network"
model = "runs/schema=combat_v4/date=2026-10-06/id=rollout-expert-iteration-v1/out/strong/update3/model"
sims = 100
rollout_mix = 0.5
decks = ["demon-form"]

[[deck]]
name = "barricade"       # Barricade+/Entrench+/Body Slam+ vs A20 Champ (network-only recipe: 595/600 vs MCTS20k 514/600)
starts = "runs/schema=human_champ_bench_v1/date=2026-10-05/id=v1/out/starts.parquet"
deck_id = "7a9ada48-a4d6-41fc-a85b-0147618df00a"
hp = 41                  # checked against the stored start
max_hp = 75

[[deck]]
name = "demon-form"      # Demon Form/Pyramid vs A20 Champ (rollout recipe, continued: 485/600 vs MCTS20k 441/600)
starts = "runs/schema=combat_v4/date=2026-10-05/id=human-deck-corpus/splits/pool.parquet"
deck_id = "249e5246-153d-4030-bc11-598774146147"
hp = 34
max_hp = 52
