# TEMPLATE: experiments/multi-fight-champ-expert/overnight.sh replaces __TRAIN_OUT__ with the champ-five-rollout-v1
# run's out/ dir and runs the result with evaluate.sh. Model fixed in advance: the LAST update (no checkpoint choice).
# 300 fresh seeds per deck, all agents on the same starts. ~65 min on 10 workers (rough).
[run]
id = "champ-five-test-v1"
worker_run = "combat_v4/2026-10-05/human-combat-r01"   # out/frozen/pv_worker, sha256 58c5c4ab...
workers = 10
fights = 300

[[agent]]
name = "five"            # champ-five-rollout-v1, update 10: one network for all five fights
kind = "network"
model = "__TRAIN_OUT__/update010/model"
sims = 2000
rollout_mix = 0.5
decks = ["barricade", "demon-form", "metallicize", "corruption", "apparition"]

[[agent]]
name = "mcts"
kind = "mcts"
sims = 20000
decks = ["barricade", "demon-form", "metallicize", "corruption", "apparition"]

[[agent]]
name = "two"             # champ-both-rollout-v1, update 5: did adding three fights cost the original two?
kind = "network"
model = "runs/schema=combat_v4/date=2026-10-08/id=champ-both-rollout-v1/out/update005/model"
sims = 2000
rollout_mix = 0.5
decks = ["barricade", "demon-form"]

[[deck]]
name = "barricade"       # Barricade+/Entrench+/Body Slam+ vs A20 Champ (network-only recipe: 595/600 vs MCTS20k 514/600)
starts = "runs/schema=human_champ_bench_v1/date=2026-10-05/id=v1/out/starts.parquet"
