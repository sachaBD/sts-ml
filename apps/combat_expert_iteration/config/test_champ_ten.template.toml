# TEMPLATE: experiments/multi-fight-champ-expert/overnight_ten.sh replaces __TRAIN_OUT__ with the champ-ten-rollout-v1
# out/ dir. Model fixed in advance: the LAST update. 300 fresh seeds per deck, all agents on the same starts.
# Rough estimate ~2.5 h on 10 workers. "five" (zero-shot transfer, never trained on these decks) runs last.
[run]
id = "champ-ten-test-v1"
worker_run = "combat_v4/2026-10-05/human-combat-r01"   # out/frozen/pv_worker, sha256 58c5c4ab...
workers = 10
fights = 300

[[agent]]
name = "ten"             # champ-ten-rollout-v1, update 10
kind = "network"
model = "__TRAIN_OUT__/update010/model"
sims = 2000
rollout_mix = 0.5
decks = ["apparition-block", "perfected-strike", "clash", "corruption-fnp", "fire-breathing", "limit-break-rage", "barricade-searing", "exhume-immolate", "demon-combust", "panache"]

[[agent]]
name = "mcts"
kind = "mcts"
sims = 20000
decks = ["apparition-block", "perfected-strike", "clash", "corruption-fnp", "fire-breathing", "limit-break-rage", "barricade-searing", "exhume-immolate", "demon-combust", "panache"]

[[agent]]
name = "five"            # champ-five-rollout-v1 update 10: transfer to unseen decks
kind = "network"
model = "runs/schema=combat_v4/date=2026-10-08/id=champ-five-rollout-v1/out/update010/model"
sims = 2000
rollout_mix = 0.5
decks = ["apparition-block", "perfected-strike", "clash", "corruption-fnp", "fire-breathing", "limit-break-rage", "barricade-searing", "exhume-immolate", "demon-combust", "panache"]

