# ./apps/card_marginals/run.sh apps/card_marginals/config/hard-elite.toml [--scratch]
# Hard-pool + elite card marginals (apps/card_marginals/card_marginals.py). Per group: base deck + n_candidates card
# additions, each on the 3 elites + random_per_group random hard-pool encounters x `seeds` shared fight seeds.
# Deck counts copied from a natural hard / elite state of natural_run (buckets 4-9); contents from the simulator.
[run]
id = "hard-elite-smoke"
stage = "hard_elite"
groups = 4
generator_seed = 0
workers = 4
encounters = ["gremlin_nob", "lagavulin", "three_sentries"]
random_encounters = ["gremlin_gang", "lots_of_slimes", "red_slaver", "exordium_thugs", "exordium_wildlife",
                     "blue_slaver", "looter", "large_slime", "three_louse", "two_fungi_beasts"]
random_per_group = 3
seeds = 8
natural_run = "combat_transition_v1/2026-09-29/act1-eval-mcts-a20-checked"
natural_buckets = [4, 5, 6, 7, 8, 9]
# combat agent: the cohort's teacher (fair guided-rollout MCTS, 8 particles); hard 2000 / elite 5000 simulations
leaf = "guided_rollout"
simulations = 2000        # hard-pool fights
elite_simulations = 5000
particles = 8
oracle = false
random_move = false
tree_reuse = false       # off: matches the easy pilot and the natural cohort (reuse changes the policy; docs/research/teacher_perf.md)

[generator]
simple_pick_prob = 0.5   # card picks, removes and upgrades: SimpleAgent's choice, else random (picks: skip_prob)
skip_prob = 0.1
uniform_frac = 0.1       # candidate uniform over the Ironclad pool instead of a natural reward roll
n_candidates = 4
